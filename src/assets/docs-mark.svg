<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="title desc">
  <title id="title">Attune event and queue paths</title>
  <desc id="desc">Configured sensors, triggers, rules, actions, and queues govern runtime records. A matching event creates an enforcement and action execution. A durable queue leases one item or a batch into the same execution path.</desc>
  <defs>
    <marker id="runtime-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#5eead4"/>
    </marker>
    <marker id="metadata-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#a5b4fc"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="478" height="358" rx="22" fill="#101827" stroke="#334155"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <g font-size="11" font-weight="700" letter-spacing=".8">
      <rect x="18" y="17" width="13" height="13" rx="3" fill="#252558" stroke="#818cf8"/>
      <text x="38" y="28" fill="#c7d2fe">CONFIGURED METADATA</text>
      <rect x="220" y="17" width="13" height="13" rx="6" fill="#12343a" stroke="#5eead4"/>
      <text x="240" y="28" fill="#99f6e4">RUNTIME RECORD</text>
    </g>

    <text x="18" y="53" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1.2">EVENT PATH</text>

    <g text-anchor="middle">
      <g>
        <rect x="18" y="64" width="88" height="36" rx="6" fill="#252558" stroke="#818cf8"/>
        <text x="62" y="87" fill="#f8fafc" font-size="15" font-weight="650">Sensor</text>
      </g>
      <g>
        <rect x="118" y="64" width="88" height="36" rx="6" fill="#252558" stroke="#818cf8"/>
        <text x="162" y="87" fill="#f8fafc" font-size="15" font-weight="650">Trigger</text>
      </g>
      <g>
        <rect x="218" y="64" width="82" height="36" rx="6" fill="#252558" stroke="#818cf8"/>
        <text x="259" y="87" fill="#f8fafc" font-size="15" font-weight="650">Rule</text>
      </g>
      <g>
        <rect x="370" y="64" width="94" height="36" rx="6" fill="#252558" stroke="#818cf8"/>
        <text x="417" y="87" fill="#f8fafc" font-size="15" font-weight="650">Action</text>
      </g>
    </g>

    <path d="M300 82H366" fill="none" stroke="#a5b4fc" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#metadata-arrow)"/>
    <text x="333" y="73" fill="#c7d2fe" font-size="10" text-anchor="middle">selects</text>

    <g text-anchor="middle">
      <g>
        <rect x="18" y="158" width="96" height="48" rx="15" fill="#12343a" stroke="#5eead4"/>
        <text x="66" y="179" fill="#f8fafc" font-size="15" font-weight="650">Event</text>
        <text x="66" y="195" fill="#99f6e4" font-size="10">for Trigger</text>
      </g>
      <g>
        <path d="m161 160 23 22-23 22-23-22Z" fill="#29364a" stroke="#cbd5e1"/>
        <text x="161" y="185" fill="#f8fafc" font-size="10" font-weight="700">MATCH?</text>
      </g>
      <g>
        <rect x="204" y="158" width="118" height="48" rx="15" fill="#12343a" stroke="#5eead4"/>
        <text x="263" y="179" fill="#f8fafc" font-size="14" font-weight="650">Enforcement</text>
        <text x="263" y="195" fill="#99f6e4" font-size="10">rule fired</text>
      </g>
      <g>
        <rect x="360" y="154" width="104" height="56" rx="15" fill="#12343a" stroke="#5eead4"/>
        <text x="412" y="177" fill="#f8fafc" font-size="14" font-weight="650">Execution</text>
        <text x="412" y="194" fill="#99f6e4" font-size="10">runs Action</text>
      </g>
    </g>

    <path d="M62 100V154" fill="none" stroke="#5eead4" stroke-width="2.2" marker-end="url(#runtime-arrow)"/>
    <text x="70" y="130" fill="#99f6e4" font-size="10">emits</text>
    <path d="M162 100 89 154" fill="none" stroke="#a5b4fc" stroke-width="1.7" stroke-dasharray="4 5" marker-end="url(#metadata-arrow)"/>
    <path d="M259 100 176 160" fill="none" stroke="#a5b4fc" stroke-width="1.7" stroke-dasharray="4 5" marker-end="url(#metadata-arrow)"/>
    <text x="218" y="123" fill="#c7d2fe" font-size="10">conditions</text>
    <path d="M114 182H134" fill="none" stroke="#5eead4" stroke-width="2.2" marker-end="url(#runtime-arrow)"/>
    <path d="M184 182H200" fill="none" stroke="#5eead4" stroke-width="2.2" marker-end="url(#runtime-arrow)"/>
    <path d="M322 182H356" fill="none" stroke="#5eead4" stroke-width="2.2" marker-end="url(#runtime-arrow)"/>
    <text x="339" y="173" fill="#99f6e4" font-size="9" text-anchor="middle">creates</text>
    <path d="M417 100V150" fill="none" stroke="#a5b4fc" stroke-width="1.7" stroke-dasharray="4 5" marker-end="url(#metadata-arrow)"/>
    <path d="M161 204V224H183" fill="none" stroke="#64748b" stroke-width="1.6"/>
    <text x="190" y="222" fill="#94a3b8" font-size="10">no match</text>
    <text x="190" y="235" fill="#94a3b8" font-size="10">no Enforcement</text>

    <line x1="18" y1="248" x2="462" y2="248" stroke="#334155"/>
    <text x="18" y="268" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1.2">DURABLE QUEUE PATH</text>

    <g text-anchor="middle">
      <g>
        <rect x="18" y="282" width="126" height="44" rx="6" fill="#252558" stroke="#818cf8"/>
        <text x="81" y="300" fill="#f8fafc" font-size="13" font-weight="650">Queue definition</text>
        <text x="81" y="316" fill="#c7d2fe" font-size="10">dispatch: Action</text>
      </g>
      <g>
        <rect x="165" y="286" width="102" height="40" rx="13" fill="#0f2931" stroke="#2dd4bf" opacity=".65"/>
        <rect x="161" y="282" width="102" height="40" rx="13" fill="#12343a" stroke="#5eead4"/>
        <text x="212" y="300" fill="#f8fafc" font-size="13" font-weight="650">Queue Items</text>
        <text x="212" y="315" fill="#99f6e4" font-size="10">one or more</text>
      </g>
      <g>
        <rect x="286" y="285" width="116" height="36" rx="18" fill="#29364a" stroke="#cbd5e1"/>
        <text x="344" y="299" fill="#f8fafc" font-size="11" font-weight="650">LEASE ONE</text>
        <text x="344" y="313" fill="#cbd5e1" font-size="10">OR A BATCH</text>
      </g>
    </g>

    <path d="M144 304H157" fill="none" stroke="#a5b4fc" stroke-width="1.7" stroke-dasharray="4 5" marker-end="url(#metadata-arrow)"/>
    <path d="M263 303H282" fill="none" stroke="#5eead4" stroke-width="2.2" marker-end="url(#runtime-arrow)"/>
    <path d="M402 303H438V214H424" fill="none" stroke="#5eead4" stroke-width="2.2" marker-end="url(#runtime-arrow)"/>
    <text x="445" y="258" fill="#99f6e4" font-size="10" text-anchor="middle" transform="rotate(-90 445 258)">creates</text>
  </g>
</svg>
