name: Publish container image

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      prerelease:
        required: true
        type: boolean
      ref:
        required: true
        type: string
      version:
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Publish image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve version
        id: version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ -n "$EXPECTED_VERSION" ] && [ "$EXPECTED_VERSION" != "$version" ]; then
            echo "Expected version $EXPECTED_VERSION, found $version" >&2
            exit 1
          fi
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v$version" ]; then
            echo "Tag $REF_NAME does not match package version $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Build and publish
        shell: bash
        env:
          PRERELEASE: ${{ inputs.prerelease || false }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          tags=(--tag "$IMAGE:$VERSION")
          if [ "$PRERELEASE" != true ]; then
            tags+=(--tag "$IMAGE:latest")
          fi
          docker buildx build . "${tags[@]}" \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.version=$VERSION" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push

      - name: Verify published image
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
