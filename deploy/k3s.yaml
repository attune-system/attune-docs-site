apiVersion: v1
kind: Namespace
metadata:
  name: attune-sites
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attune-docs-site
  namespace: attune-sites
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attune-docs-site
  template:
    metadata:
      labels:
        app: attune-docs-site
    spec:
      containers:
        - name: site
          image: ghcr.io/attune-system/attune-docs-site:0.1.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: attune-docs-site
  namespace: attune-sites
spec:
  selector:
    app: attune-docs-site
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: attune-docs-site
  namespace: attune-sites
spec:
  ingressClassName: traefik
  rules:
    - host: docs.attunedev.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: attune-docs-site
                port:
                  name: http
